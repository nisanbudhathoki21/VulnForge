id: starbucks-jp-public
name: Starbucks Japan - Public-Facing Vulnerability Scan
severity: medium

description: >
  Public-facing HTTP security checks for information disclosure,
  administrative interfaces, GraphQL exposure, CORS, directory listing,
  injection indicators, and reflected input.

requests:

  # ================================================================
  # 1. Git exposure
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
      - "{{BaseURL}}/.git/config"
      - "{{BaseURL}}/.git/index"

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "ref: refs/heads/"
          - "[core]"

  # ================================================================
  # 2. Environment/configuration exposure
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/appsettings.json"
      - "{{BaseURL}}/config/application.properties"
      - "{{BaseURL}}/secrets.json"

    matchers:
      - type: status
        status: 200

      - type: regex
        part: body
        regex:
          - 'DB_'
          - 'SECRET'
          - 'AWS_'
          - 'PASSWORD'
          - 'TOKEN'
          - 'API_KEY'
          - 'JWT_SECRET'
          - 'REDIS'
          - 'MONGO'

  # ================================================================
  # 3. Backup files
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/backup.zip"
      - "{{BaseURL}}/backup.tar.gz"
      - "{{BaseURL}}/old/"
      - "{{BaseURL}}/dump.sql"

    matchers:
      - type: status
        status: 200

      - type: regex
        part: header
        regex:
          - 'application/zip'
          - 'application/x-tar'

  # ================================================================
  # 4. Admin/debug interfaces
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/sidekiq/busy"
      - "{{BaseURL}}/sidekiq/queues"
      - "{{BaseURL}}/actuator/health"
      - "{{BaseURL}}/actuator/env"
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/api-docs"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/_status"

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "Sidekiq"
          - "Actuator"
          - "Swagger"
          - "phpinfo"
          - "Server Status"

  # ================================================================
  # 5. GraphQL introspection
  # ================================================================

  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/v1/graphql"
      - "{{BaseURL}}/gql"

    headers:
      Content-Type: application/json
      Accept: application/json

    body: |
      {
        "query": "{ __schema { queryType { name } } }"
      }

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "__schema"
          - "queryType"

  # ================================================================
  # 6. CORS
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/api"

    headers:
      Origin: "https://example.com"

    matchers:
      - type: header
        name: Access-Control-Allow-Origin
        value: "*"

  # ================================================================
  # 7. Directory listing
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/images/"
      - "{{BaseURL}}/assets/"
      - "{{BaseURL}}/static/"
      - "{{BaseURL}}/uploads/"
      - "{{BaseURL}}/backup/"

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "Index of /"

  # ================================================================
  # 8. SQL error indicators
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/search?q=test%27"
      - "{{BaseURL}}/products?category=1%27"
      - "{{BaseURL}}/gift?code=test%27"

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "SQLSTATE"
          - "MySQL"
          - "PostgreSQL"
          - "ORA-"
          - "Unclosed quotation mark"

  # ================================================================
  # 9. Reflected input indicator
  # ================================================================

  - method: GET
    path:
      - "{{BaseURL}}/search?q=VulnForgeTest123"

    matchers:
      - type: status
        status: 200

      - type: word
        part: body
        words:
          - "VulnForgeTest123"

  # ================================================================
  # DNS/subdomain takeover is intentionally not here.
  # DNS requires a separate DNS-capable scanner.
  # ================================================================
