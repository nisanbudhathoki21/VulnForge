id: ENV-EXPOSURE-ADV-01
name: Advanced Environment & Config File Exposure
severity: low
category: information-disclosure
metadata:
  cwe: CWE-538
  tags: ["env", "secrets", "config", "exposure"]

requests:
  # Stage 1: Common Config File Paths
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.backup"
      - "{{BaseURL}}/.env.old"
      - "{{BaseURL}}/.aws/credentials"
      - "{{BaseURL}}/.aws/config"
      - "{{BaseURL}}/config/application.properties"
      - "{{BaseURL}}/WEB-INF/application.properties"
      - "{{BaseURL}}/appsettings.json"
      - "{{BaseURL}}/settings.py"
      - "{{BaseURL}}/secret.yml"
      - "{{BaseURL}}/secrets.json"
    matchers:
      - type: status
        status:
          - 200
          - 403                    # Sometimes 403 means the file exists but can't list

  # Stage 2: Secret Extraction with Regex
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/config.ini"
    matchers:
      - type: regex
        regex:
          - 'DATABASE_URL\s*=\s*[^\s]+'
          - 'SECRET_KEY\s*=\s*[^\s]+'
          - 'AWS_ACCESS_KEY_ID\s*=\s*[A-Z0-9]+'
          - 'AWS_SECRET_ACCESS_KEY\s*=\s*[A-Za-z0-9\/+]+'
          - 'STRIPE_API_KEY\s*=\s*sk_live_[A-Za-z0-9]+'
          - 'JWT_SECRET\s*=\s*[A-Za-z0-9_-]+'
          - 'GITHUB_TOKEN\s*=\s*[A-Za-z0-9_]+'
          - 'MONGO_URI\s*=\s*mongodb://[^\s]+'
          - 'REDIS_PASSWORD\s*=\s*[^\s]+'
        part: body

  # Stage 3: Actuator / Debug Exposures (Spring Boot / Flask debug)
  - method: GET
    path:
      - "{{BaseURL}}/actuator/env"
      - "{{BaseURL}}/actuator/configprops"
      - "{{BaseURL}}/debug/vars"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/_status"
    matchers:
      - type: word
        words:
          - "DB_PASSWORD"
          - "JWT_SECRET"
          - "spring.datasource"
          - "SECRET_KEY"
        part: body
